```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stock Asset</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f6f8;
            color: #17191c;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;

</head>

<body>

<div class="container">

    <div class="header">
        <h1>📊 Stock Asset</h1>

        <select id="accountSelect">
            <option value="me">내 계좌</option>
            <option value="friend1">친구 A</option>
        </select>
    </div>

    <div class="summary">

        <div class="card">
            <div class="label">투자 원금</div>
            <div class="value" id="totalInvestment">$0</div>
            <div class="sub" id="totalInvestmentKRW">₩0</div>
        </div>

        <div class="card">
            <div class="label">현재 평가금액</div>
            <div class="value" id="totalValue">$0</div>
            <div class="sub" id="totalValueKRW">₩0</div>
        </div>

        <div class="card">
            <div class="label">총 수익률</div>
            <div class="value" id="totalReturn">0%</div>
            <div class="sub" id="totalProfit">$0</div>
        </div>

    </div>

    <div class="section-title">보유 주식</div>

    <div id="stocks">
        <div class="loading">주가를 불러오는 중...</div>
    </div>

    <div class="exchange">
        USD/KRW 환율:
        <strong id="exchangeRate">불러오는 중...</strong>
    </div>

    <div class="updated" id="updated">
        데이터를 불러오는 중...
    </div>

</div>


<script>

/*
========================================
계좌 설정
========================================

여기에 다른 사람의 계좌를 추가하면 된다.

shares = 보유 주식 수
buyPrice = 매수가

*/

const accounts = {

    me: {
        name: "내 계좌",

        stocks: {
            QQQM: {
                shares: 10,
                buyPrice: 200
            },

            TQQQ: {
                shares: 10,
                buyPrice: 50
            }
        }
    },

    friend1: {
        name: "친구 A",

        stocks: {
            QQQM: {
                shares: 5,
                buyPrice: 180
            },

            TQQQ: {
                shares: 10,
                buyPrice: 45
            }
        }
    }

};


let exchangeRate = 0;


/*
========================================
숫자 표시
========================================
*/

function moneyUSD(value) {
    return "$" + value.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}


function moneyKRW(value) {
    return "₩" + Math.round(value).toLocaleString("ko-KR");
}


function percent(value) {
    return (value >= 0 ? "+" : "") +
        value.toFixed(2) + "%";
}


/*
========================================
주가 가져오기
Yahoo Finance Chart API
========================================
*/

async function getStockPrice(symbol) {

    const url =
        `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?range=1d&interval=1m`;

    try {

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("주가 요청 실패");
        }

        const data = await response.json();

        const result = data.chart.result[0];

        const price =
            result.meta.regularMarketPrice;

        return price;

    } catch (error) {

        console.error(symbol, error);

        return null;
    }
}


/*
========================================
USD/KRW 환율 가져오기
========================================
*/

async function getExchangeRate() {

    try {

        const response = await fetch(
            "https://api.frankfurter.app/latest?from=USD&to=KRW"
        );

        const data = await response.json();

        return data.rates.KRW;

    } catch (error) {

        console.error("환율 오류:", error);

        return null;
    }
}


/*
========================================
화면 표시
========================================
*/

async function updatePage() {

    const accountKey =
        document.getElementById("accountSelect").value;

    const account = accounts[accountKey];

    document.getElementById("stocks").innerHTML =
        `<div class="loading">주가를 불러오는 중...</div>`;


    /*
    환율
    */

    const rate = await getExchangeRate();

    if (rate) {
        exchangeRate = rate;

        document.getElementById("exchangeRate").textContent =
            `₩${rate.toLocaleString("ko-KR", {
                maximumFractionDigits: 2
            })}`;
    }


    let totalInvestment = 0;
    let totalValue = 0;


    /*
    주식 정보 가져오기
    */

    const stockResults = [];


    for (const symbol in account.stocks) {

        const stock = account.stocks[symbol];

        const currentPrice =
            await getStockPrice(symbol);


        /*
        API 오류가 발생하면
        매수가를 임시 현재가로 사용하지 않고
        표시만 오류 처리
        */

        stockResults.push({
            symbol,
            shares: stock.shares,
            buyPrice: stock.buyPrice,
            currentPrice
        });


        totalInvestment +=
            stock.shares * stock.buyPrice;

        if (currentPrice !== null) {

            totalValue +=
                stock.shares * currentPrice;

        } else {

            totalValue +=
                stock.shares * stock.buyPrice;

        }

    }


    /*
    전체 수익
    */

    const totalProfit =
        totalValue - totalInvestment;

    const totalReturn =
        totalInvestment === 0
            ? 0
            : (totalProfit / totalInvestment) * 100;


    /*
    상단 요약
    */

    document.getElementById("totalInvestment").textContent =
        moneyUSD(totalInvestment);

    document.getElementById("totalValue").textContent =
        moneyUSD(totalValue);

    document.getElementById("totalInvestmentKRW").textContent =
        exchangeRate
            ? moneyKRW(totalInvestment * exchangeRate)
            : "₩-";

    document.getElementById("totalValueKRW").textContent =
        exchangeRate
            ? moneyKRW(totalValue * exchangeRate)
            : "₩-";


    const totalReturnElement =
        document.getElementById("totalReturn");

    totalReturnElement.textContent =
        percent(totalReturn);

    totalReturnElement.className =
        "value " +
        (totalReturn >= 0 ? "profit" : "loss");


    const totalProfitElement =
        document.getElementById("totalProfit");

    totalProfitElement.textContent =
        (totalProfit >= 0 ? "+" : "") +
        moneyUSD(totalProfit);

    totalProfitElement.className =
        "sub " +
        (totalProfit >= 0 ? "profit" : "loss");


    /*
    종목 카드 생성
    */

    const stocksContainer =
        document.getElementById("stocks");

    stocksContainer.innerHTML = "";


    for (const stock of stockResults) {

        const currentPrice =
            stock.currentPrice;

        const evaluation =
            currentPrice !== null
                ? currentPrice * stock.shares
                : stock.buyPrice * stock.shares;

        const investment =
            stock.buyPrice * stock.shares;

        const profit =
            evaluation - investment;

        const returnRate =
            investment === 0
                ? 0
                : (profit / investment) * 100;


        const card =
            document.createElement("div");

        card.className = "stock";


        card.innerHTML = `

            <div class="stock-top">

                <div class="ticker">
                    ${stock.symbol}
                </div>

                <div class="price">
                    ${
                        currentPrice !== null
                            ? moneyUSD(currentPrice)
                            : "가격 오류"
                    }
                </div>

            </div>


            <div class="stock-grid">

                <div class="stock-item">

                    <div class="label">
                        보유수량
                    </div>

                    <div class="number">
                        ${stock.shares}주
                    </div>

                </div>


                <div class="stock-item">

                    <div class="label">
                        매수가
                    </div>

                    <div class="number">
                        ${moneyUSD(stock.buyPrice)}
                    </div>

                </div>


                <div class="stock-item">

                    <div class="label">
                        평가금액
                    </div>

                    <div class="number">
                        ${moneyUSD(evaluation)}
                    </div>

                </div>


                <div class="stock-item">

                    <div class="label">
                        수익률
                    </div>

                    <div class="number ${
                        returnRate >= 0
                            ? "profit"
                            : "loss"
                    }">

                        ${percent(returnRate)}

                    </div>

                </div>

            </div>


            <div class="sub ${
                profit >= 0
                    ? "profit"
                    : "loss"
            }">

                손익:
                ${profit >= 0 ? "+" : ""}
                ${moneyUSD(profit)}

            </div>

        `;


        stocksContainer.appendChild(card);

    }


    document.getElementById("updated").textContent =
        "마지막 업데이트: " +
        new Date().toLocaleTimeString("ko-KR");

}


/*
========================================
계좌 변경
========================================
*/

document
    .getElementById("accountSelect")
    .addEventListener("change", updatePage);


/*
========================================
처음 실행
========================================
*/

updatePage();


/*
========================================
1분마다 갱신
========================================
*/

setInterval(updatePage, 60000);

</script>

</body>
</html>
